name: CI with Security Scanners

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  # Maven project is nested inside the repository.
  PROJECT_DIR: sbp-lab3-master/sbp-lab3
  # Fail the build when a dependency has a vulnerability at/above this CVSS.
  CVSS_THRESHOLD: '7'

jobs:
  build-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-dc-data-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-owasp-dc-data-

      - name: Resolve dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./mvnw -B -ntp dependency:go-offline

      # Compile first: SpotBugs analyzes target/classes, so classes must exist.
      - name: Compile sources
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./mvnw -B -ntp compile

      # ------------------------------------------------------------
      # SAST: SpotBugs + FindSecBugs security rules
      #   Configuration (effort/threshold/findsecbugs plugin) lives in
      #   pom.xml. Produces target/spotbugsXml.xml. Findings do NOT fail
      #   the build (failOnError=false); the report is published instead.
      # ------------------------------------------------------------
      - name: SAST - SpotBugs (with FindSecBugs)
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./mvnw -B -ntp spotbugs:spotbugs

      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./mvnw -B -ntp test

      # ------------------------------------------------------------
      # SCA: OWASP Dependency-Check against known CVEs (NVD)
      #   OSS Index is disabled (requires credentials); the NVD analyzer
      #   runs without an account. The build fails on CVSS >= threshold.
      # ------------------------------------------------------------
      - name: SCA - OWASP Dependency-Check
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw -B -ntp org.owasp:dependency-check-maven:10.0.4:check \
            -DfailBuildOnCVSS=${{ env.CVSS_THRESHOLD }} \
            -Danalyzer.ossindex.enabled=false \
            -Dformat=ALL \
            ${NVD_API_KEY:+-DnvdApiKey=$NVD_API_KEY}

      # ------------------------------------------------------------
      # Publish findings to the GitHub Security tab (SARIF)
      # ------------------------------------------------------------
      - name: Upload SARIF to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.PROJECT_DIR }}/target/dependency-check-report.sarif
          category: owasp-dependency-check

      # ------------------------------------------------------------
      # Upload security reports as build artifacts
      # ------------------------------------------------------------
      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: ${{ env.PROJECT_DIR }}/target/spotbugsXml.xml
          if-no-files-found: warn

      - name: Upload OWASP Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            ${{ env.PROJECT_DIR }}/target/dependency-check-report.html
            ${{ env.PROJECT_DIR }}/target/dependency-check-report.json
            ${{ env.PROJECT_DIR }}/target/dependency-check-report.xml
            ${{ env.PROJECT_DIR }}/target/dependency-check-report.csv
            ${{ env.PROJECT_DIR }}/target/dependency-check-report.sarif
          if-no-files-found: warn