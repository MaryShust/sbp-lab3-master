# Logging
logging.level.com.example.sbp=DEBUG

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# HTTP
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Jackson (JSON parser)
spring.jackson.character-encoding=UTF-8
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.deserialization.fail-on-unknown-properties=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


# Hibernate
logging.org.hibernate=DEBUG
logging.org.hibernate.validator=DEBUG

# JPA
logging.javax.persistence=DEBUG


logging.level.org.hibernate=DEBUG
logging.level.org.springframework.orm=DEBUG
logging.level.org.hibernate.validator=DEBUG
server.error.include-stacktrace=always
logging.level.org.springframework.orm.jpa=DEBUG


spring.main.allow-bean-definition-overriding=true


# Users XML file
users.xml.path=./users.xml

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=sbp-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Kafka Topics
sbp.kafka.topics.fraud-check=sbp-fraud-check

# Bitrix24 Configuration
bitrix24.webhook.url=https://b24-xtdpqo.bitrix24.ru/rest/1/sq3o8qzbizrqpy4h/